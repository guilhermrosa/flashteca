<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashteca</title>
  <meta name="description" content="Jogue os jogos em Flash dos CDs e DVDs de coletânea preservados no Internet Archive, direto no navegador.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23ffb000'/><circle cx='32' cy='32' r='9' fill='%23141a2e'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="#/">
      <span class="logo-disco" aria-hidden="true"></span>
      <span>Flashteca</span>
    </a>
    <nav>
      <a href="#/" data-nav="estante">Estante</a>
      <a href="#/explorar" data-nav="explorar">Explorar o Archive</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="rodape">
    <p>Os jogos não ficam aqui: são carregados direto do <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a> e rodam no <a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a>, um emulador de Flash de código aberto. Todos os direitos dos jogos pertencem aos seus autores.</p>
  </footer>

  <audio id="trilha" loop preload="none"></audio>

  <script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
