<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashteca</title>
  <meta name="description" content="Os CDs de jogos em Flash que vinham nas bancas, de volta ao navegador. Coletâneas preservadas no Internet Archive.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121117" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icone.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="#/" aria-label="Flashteca, início">
      <img src="img/icone.svg" alt="" width="34" height="34">
      <span>Flashteca</span>
    </a>
    <nav>
      <a href="#/" data-nav="estante">Estante</a>
      <a href="#/explorar" data-nav="explorar">Explorar</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="rodape">
    <p>Os jogos não ficam aqui: são carregados direto do <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a> e rodam no <a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a>, um emulador de Flash de código aberto. Os direitos dos jogos e dos discos pertencem aos seus autores.</p>
  </footer>

  <audio id="trilha" loop preload="none"></audio>

  <script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
