<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashteca</title>
  <meta name="description" content="Os CDs de jogos em Flash que vinham nas bancas, de volta ao navegador. Coletâneas preservadas no Internet Archive.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121117" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="img/icone-16.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>body { opacity: 0; }</style>
</head>
<body>
  <header class="topo">
    <a class="logo" href="#/" aria-label="Flashteca, início">
      <img src="img/icone.svg" alt="" width="34" height="34">
      <span>Flashteca</span>
    </a>
    <nav>
      <a href="#/" data-nav="estante">Estante</a>
      <a href="#/explorar" data-nav="explorar">Explorar</a>
      <button type="button" id="bt-instalar" hidden>Instalar app</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="rodape">
    <p>Os jogos não ficam aqui: são carregados direto do <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a> e rodam no <a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a>, um emulador de Flash de código aberto. Os direitos dos jogos e dos discos pertencem aos seus autores.</p>
  </footer>

  <audio id="trilha" loop preload="none"></audio>

  <script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
  <script>
    // O GitHub Pages deixa os arquivos em cache por 10 minutos. Antes de carregar o site, confere
    // com o servidor se o CSS e o JS mudaram (consulta condicional: só baixa de novo o que mudou)
    // e só então os carrega, já atualizados no cache do navegador.
    (() => {
      const arquivos = ["css/style.css", "js/app.js", "js/archive.js", "js/catalogo.js", "js/toque.js"];
      const conferir = Promise.all(arquivos.map((a) => fetch(a, { cache: "no-cache" }).catch(() => {})));
      const limite = new Promise((ok) => setTimeout(ok, 3000)); // rede ruim: não trava a página
      Promise.race([conferir, limite]).then(() => {
        const css = Object.assign(document.createElement("link"), { rel: "stylesheet", href: "css/style.css" });
        css.onerror = () => (document.body.style.opacity = 1);
        document.head.append(css);
        document.body.append(Object.assign(document.createElement("script"), { type: "module", src: "js/app.js" }));
      });
    })();
  </script>
</body>
</html>
