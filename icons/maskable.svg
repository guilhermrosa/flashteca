    <rect x="35.5" y="15" width="19" height="33" rx="2.6" fill="#ffd6f5" stroke="#1e0b4d" stroke-width="1.6"/>
    <circle cx="45" cy="31.5" r="8.4" fill="url(#disco)" stroke="#1e0b4d" stroke-width="1.8"/>
