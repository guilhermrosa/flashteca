  </defs>
  <rect width="64" height="64" fill="url(#fundo)"/>
  <g transform="translate(6.399999999999999 6.399999999999999) scale(0.8)">
  
  <!-- lombadas na prateleira -->
  <rect x="9.5" y="19" width="7" height="29" rx="1.8" fill="#fff6e5"/>
  <rect x="9.5" y="24" width="7" height="3" fill="#c6ff3d"/>
  <rect x="18.5" y="14" width="7" height="34" rx="1.8" fill="#ffd6f5"/>
  <rect x="18.5" y="19" width="7" height="3" fill="#8a4dff" opacity=".55"/>
  <rect x="27.5" y="21" width="7" height="27" rx="1.8" fill="#fff6e5"/>
  <rect x="27.5" y="26" width="7" height="3" fill="#ff8fd8"/>
  <!-- estojo puxado, mostrando o disco -->
